<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> SIMPLE CISCO - Network Simulator</title>

<style>
:root{
    --primary:#274ab7;
    --dark:#17327f;
    --success:#16a34a;
    --warning:#f59e0b;
    --danger:#dc2626;
    --offline:#94a3b8;
    --bg:#eef2f7;
    --border:#d8e0ea;
    --text:#1e293b;
    --muted:#64748b;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
    touch-action:manipulation;
}

/* HEADER */

header{
    background:linear-gradient(135deg,var(--dark),var(--primary));
    color:white;
    padding:16px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:12px;
}

.header-icon{
    font-size:32px;
}

h1{
    font-size:22px;
}

.subtitle{
    font-size:11px;
    opacity:.85;
}

/* LAYOUT */

.app{
    max-width:1200px;
    margin:auto;
    padding:12px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:14px;
    margin-bottom:12px;
}

.section-title{
    font-size:11px;
    color:var(--muted);
    font-weight:bold;
    text-transform:uppercase;
    margin-bottom:10px;
}

/* BUTTON */

.device-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.action-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}

.topology-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}

.btn{
    border:none;
    border-radius:10px;
    padding:11px 5px;
    font-size:11px;
    font-weight:bold;
}

.btn:active{
    transform:scale(.97);
}

.device-btn{
    background:#eef3ff;
    color:var(--primary);
    border:1px solid #d4dfff;
}

.device-icon{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.primary{
    background:var(--primary);
    color:white;
}

.success{
    background:var(--success);
    color:white;
}

.warning{
    background:var(--warning);
    color:white;
}

.danger{
    background:#fee2e2;
    color:var(--danger);
}

.secondary{
    background:#e7edf6;
    color:#334155;
}

.topology-btn{
    background:white;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    font-size:11px;
    font-weight:bold;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-bottom:12px;
}

.stat{
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
    padding:9px 4px;
    text-align:center;
}

.stat small{
    display:block;
    font-size:8px;
    color:var(--muted);
}

.stat b{
    display:block;
    margin-top:4px;
    color:var(--primary);
    font-size:16px;
}

/* WORKSPACE */

.workspace-card{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:10px;
}

.workspace-head{
    display:flex;
    justify-content:space-between;
    padding:5px 5px 12px;
    font-size:13px;
    font-weight:bold;
}

.workspace{
    position:relative;
    width:100%;
    height:650px;
    overflow:hidden;
    border:2px solid var(--border);
    border-radius:14px;
    touch-action:none;

    background-color:#f8fafc;
    background-image:
        linear-gradient(#e5eaf1 1px,transparent 1px),
        linear-gradient(90deg,#e5eaf1 1px,transparent 1px);
    background-size:40px 40px;
}

.network-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:1;
}

.connection-line{
    stroke:#64748b;
    stroke-width:4;
    stroke-linecap:round;
}

/* DEVICE */

.device{
    position:absolute;
    width:88px;
    height:78px;
    background:white;
    border:2px solid var(--offline);
    border-radius:14px;
    z-index:10;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:0 5px 14px rgba(0,0,0,.10);

    user-select:none;
    touch-action:none;

    transition:
        border .2s,
        background .2s,
        box-shadow .2s;
}

/* OFFLINE */

.device.offline{
    border-color:var(--offline);
}

/* ONLINE */

.device.active{
    border-color:var(--success);
    background:#f0fdf4;

    box-shadow:
        0 0 0 4px rgba(22,163,74,.14),
        0 5px 14px rgba(0,0,0,.1);
}

/* TRANSMITTING */

.device.transmitting{
    border-color:var(--warning);
    background:#fffbeb;

    box-shadow:
        0 0 0 5px rgba(245,158,11,.18),
        0 0 20px rgba(245,158,11,.4);
}

/* ERROR */

.device.error{
    border-color:var(--danger);
    background:#fef2f2;

    box-shadow:
        0 0 0 4px rgba(220,38,38,.12);
}

/* SELECT */

.device.selected{
    outline:4px solid rgba(39,74,183,.18);
}

.device-symbol{
    font-size:26px;
}

.device-name{
    font-size:10px;
    font-weight:bold;
    margin-top:3px;
}

.device-status{
    font-size:7px;
    margin-top:2px;
    font-weight:bold;
}

.status-online{
    color:var(--success);
}

.status-busy{
    color:var(--warning);
}

.status-error{
    color:var(--danger);
}

.status-offline{
    color:var(--offline);
}

/* PACKET */

.packet{
    position:absolute;
    width:26px;
    height:26px;
    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#facc15;

    box-shadow:
        0 0 14px rgba(250,204,21,.85);

    z-index:50;
    pointer-events:none;

    font-size:13px;

    transition:
        left .65s linear,
        top .65s linear;
}

/* EVENT */

.event-card{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:14px;
    margin-top:12px;
}

.event-title{
    font-size:13px;
    font-weight:bold;
    margin-bottom:10px;
}

.event-log{
    max-height:270px;
    overflow-y:auto;
}

.event{
    background:#f8fafc;
    border-left:4px solid var(--offline);
    border-radius:8px;
    padding:9px;
    margin-bottom:7px;
    font-size:11px;
}

.event.sending{
    border-left-color:var(--warning);
}

.event.success{
    border-left-color:var(--success);
}

.event.failed{
    border-left-color:var(--danger);
}

/* STATUS */

.status-box{
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px;
    margin-top:12px;
    font-size:12px;
}

/* EMPTY */

.empty{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    transform:translateY(-50%);
    text-align:center;
    color:var(--offline);
    pointer-events:none;
}

@media(max-width:600px){

    .workspace{
        height:600px;
    }

    .device{
        width:80px;
        height:74px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="header-icon">🌐</div>

        <div>
            <h1>SIMPLE CISCO</h1>
            <div class="subtitle">
                Ikhsan R.D & M.Ziqri R DEV
            </div>
        </div>

    </div>
</header>

<div class="app">

    <div class="card">

        <div class="section-title">
            Tambah Perangkat
        </div>

        <div class="device-grid">

            <button class="btn device-btn" onclick="addDevice('PC')">
                <span class="device-icon">🖥️</span>
                PC
            </button>

            <button class="btn device-btn" onclick="addDevice('Switch')">
                <span class="device-icon">🔀</span>
                Switch
            </button>

            <button class="btn device-btn" onclick="addDevice('Router')">
                <span class="device-icon">📡</span>
                Router
            </button>

            <button class="btn device-btn" onclick="addDevice('Server')">
                <span class="device-icon">🗄️</span>
                Server
            </button>

        </div>

        <div class="action-grid">

            <button id="connectBtn"
                    class="btn primary"
                    onclick="toggleConnect()">
                🔗 Hubungkan
            </button>

            <button id="simulationBtn"
                    class="btn success"
                    onclick="startSimulation()">
                ▶️ Mulai
            </button>

            <button class="btn danger"
                    onclick="deleteSelected()">
                🗑️ Hapus
            </button>

        </div>

        <div class="section-title"
             style="margin-top:16px">
            Topologi Otomatis
        </div>

        <div class="topology-grid">

            <button class="topology-btn"
                    onclick="createStar()">
                ⭐ Star
            </button>

            <button class="topology-btn"
                    onclick="createBus()">
                🚌 Bus
            </button>

            <button class="topology-btn"
                    onclick="createRing()">
                🔄 Ring
            </button>

        </div>

        <button class="btn danger"
                style="width:100%;margin-top:10px"
                onclick="resetNetwork()">
            ♻️ Reset Semua
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <small>PERANGKAT</small>
            <b id="deviceCount">0</b>
        </div>

        <div class="stat">
            <small>KONEKSI</small>
            <b id="connectionCount">0</b>
        </div>

        <div class="stat">
            <small>SUCCESS</small>
            <b id="successCount">0</b>
        </div>

        <div class="stat">
            <small>FAILED</small>
            <b id="failedCount">0</b>
        </div>

    </div>


    <div class="workspace-card">

        <div class="workspace-head">
            <span>🛠️ Area Simulasi</span>
            <span>● NETWORK READY</span>
        </div>

        <div id="workspace"
             class="workspace">

            <svg id="networkSvg"
                 class="network-svg">
            </svg>

            <div id="emptyMessage"
                 class="empty">

                <div style="font-size:45px">
                    🌐
                </div>

                <b>Workspace Kosong</b>

                <div style="font-size:11px;margin-top:5px">
                    Tambahkan perangkat untuk memulai
                </div>

            </div>

        </div>

    </div>


    <div class="event-card">

        <div class="event-title">
            📋 Simulation Event Log
        </div>

        <div id="eventLog"
             class="event-log">

            <div class="event">
                Sistem siap.
            </div>

        </div>

    </div>


    <div class="status-box"
         id="statusText">

        Siap membuat jaringan.

    </div>

</div>


<script>

/* =====================
   DATA
===================== */

const workspace =
    document.getElementById("workspace");

const networkSvg =
    document.getElementById("networkSvg");

const eventLog =
    document.getElementById("eventLog");

const emptyMessage =
    document.getElementById("emptyMessage");


let devices = [];

let connections = [];

let selectedDevices = [];

let selectedForDelete = null;

let connectMode = false;

let idCounter = 0;

let pcCounter = 0;

let packetCounter = 0;

let successCounter = 0;

let failedCounter = 0;

let activePackets = [];


/* =====================
   ICON
===================== */

const icons = {

    PC:"🖥️",

    Switch:"🔀",

    Router:"📡",

    Server:"🗄️"

};


/* =====================
   UPDATE UI
===================== */

function updateUI(){

    document.getElementById("deviceCount").textContent =
        devices.length;

    document.getElementById("connectionCount").textContent =
        connections.length;

    document.getElementById("successCount").textContent =
        successCounter;

    document.getElementById("failedCount").textContent =
        failedCounter;

    emptyMessage.style.display =
        devices.length
        ? "none"
        : "block";

}


/* =====================
   ADD DEVICE
===================== */

function addDevice(type,x=null,y=null){

    idCounter++;

    if(type === "PC"){
        pcCounter++;
    }


    const element =
        document.createElement("div");

    element.className =
        "device offline";


    const name =
        type === "PC"
        ? "PC " + pcCounter
        : type + " " + idCounter;


    element.innerHTML = `
        <div class="device-symbol">
            ${icons[type]}
        </div>

        <div class="device-name">
            ${name}
        </div>

        <div class="device-status status-offline">
            ● OFFLINE
        </div>
    `;


    workspace.appendChild(
        element
    );


    const device = {

        id:idCounter,

        type:type,

        name:name,

        element:element

    };


    devices.push(device);


    setDevicePosition(

        device,

        x ?? (
            20 +
            ((devices.length * 80) % 250)
        ),

        y ?? (
            20 +
            ((devices.length * 90) % 400)
        )

    );


    makeDraggable(device);

    updateUI();

    return device;

}


/* =====================
   STATUS DEVICE
===================== */

function setDeviceState(
    device,
    state
){

    device.element.classList.remove(
        "offline",
        "active",
        "transmitting",
        "error"
    );


    device.element.classList.add(
        state
    );


    const status =
        device.element.querySelector(
            ".device-status"
        );


    status.className =
        "device-status";


    if(state === "active"){

        status.textContent =
            "● ONLINE";

        status.classList.add(
            "status-online"
        );

    }

    if(state === "transmitting"){

        status.textContent =
            "● BUSY";

        status.classList.add(
            "status-busy"
        );

    }

    if(state === "error"){

        status.textContent =
            "● ERROR";

        status.classList.add(
            "status-error"
        );

    }

    if(state === "offline"){

        status.textContent =
            "● OFFLINE";

        status.classList.add(
            "status-offline"
        );

    }

}


/* =====================
   POSITION
===================== */

function setDevicePosition(
    device,
    x,
    y
){

    const maxX =
        workspace.clientWidth -
        device.element.offsetWidth -
        5;

    const maxY =
        workspace.clientHeight -
        device.element.offsetHeight -
        5;


    device.element.style.left =
        Math.max(
            5,
            Math.min(x,maxX)
        ) + "px";


    device.element.style.top =
        Math.max(
            5,
            Math.min(y,maxY)
        ) + "px";

}


/* =====================
   DRAG
===================== */

function makeDraggable(device){

    const el =
        device.element;

    let startX;
    let startY;
    let oldX;
    let oldY;

    let dragging = false;
    let moved = false;


    el.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();


            if(connectMode){

                selectConnectionDevice(
                    device
                );

                return;

            }


            dragging = true;

            moved = false;

            startX = e.clientX;
            startY = e.clientY;

            oldX = el.offsetLeft;
            oldY = el.offsetTop;


            el.setPointerCapture(
                e.pointerId
            );

        }
    );


    el.addEventListener(
        "pointermove",
        e => {

            if(!dragging){
                return;
            }


            const dx =
                e.clientX - startX;

            const dy =
                e.clientY - startY;


            if(
                Math.abs(dx) > 5 ||
                Math.abs(dy) > 5
            ){

                moved = true;

                setDevicePosition(

                    device,

                    oldX + dx,

                    oldY + dy

                );


                updateConnections();

            }

        }
    );


    el.addEventListener(
        "pointerup",
        () => {

            if(!dragging){
                return;
            }


            dragging = false;


            if(!moved){

                selectedForDelete =
                    device.id;

                clearSelection();

                el.classList.add(
                    "selected"
                );

            }

        }
    );

}


/* =====================
   CONNECT MODE
===================== */

function toggleConnect(){

    connectMode =
        !connectMode;


    selectedDevices = [];

    clearSelection();


    const btn =
        document.getElementById(
            "connectBtn"
        );


    if(connectMode){

        btn.textContent =
            "❌ Batal";

        btn.className =
            "btn warning";


        document.getElementById(
            "statusText"
        ).textContent =
            "🔗 Pilih 2 perangkat untuk dihubungkan.";

    }else{

        btn.textContent =
            "🔗 Hubungkan";

        btn.className =
            "btn primary";

    }

}


/* =====================
   SELECT CONNECTION
===================== */

function selectConnectionDevice(device){

    if(
        selectedDevices.includes(
            device.id
        )
    ){
        return;
    }


    selectedDevices.push(
        device.id
    );


    device.element.classList.add(
        "selected"
    );


    if(
        selectedDevices.length < 2
    ){

        document.getElementById(
            "statusText"
        ).textContent =
            "Pilih perangkat kedua.";

        return;

    }


    const a =
        selectedDevices[0];

    const b =
        selectedDevices[1];


    const exists =
        connections.some(
            c =>
                (c.a === a && c.b === b) ||
                (c.a === b && c.b === a)
        );


    if(!exists){

        createConnection(a,b);

    }


    selectedDevices = [];

    clearSelection();

}


/* =====================
   CREATE CONNECTION
===================== */

function createConnection(a,b){

    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    line.setAttribute(
        "class",
        "connection-line"
    );


    networkSvg.appendChild(
        line
    );


    connections.push({
        a,
        b,
        line
    });


    updateConnections();

    updateDeviceOnlineStatus();

    updateUI();

}


/* =====================
   ONLINE STATUS
===================== */

function updateDeviceOnlineStatus(){

    devices.forEach(
        device => {

            const connected =
                connections.some(
                    c =>
                        c.a === device.id ||
                        c.b === device.id
                );


            if(connected){

                setDeviceState(
                    device,
                    "active"
                );

            }else{

                setDeviceState(
                    device,
                    "offline"
                );

            }

        }
    );

}


/* =====================
   LINES
===================== */

function updateConnections(){

    connections.forEach(
        c => {

            const a =
                devices.find(
                    d => d.id === c.a
                );

            const b =
                devices.find(
                    d => d.id === c.b
                );


            if(!a || !b){
                return;
            }


            c.line.setAttribute(
                "x1",
                a.element.offsetLeft +
                a.element.offsetWidth / 2
            );

            c.line.setAttribute(
                "y1",
                a.element.offsetTop +
                a.element.offsetHeight / 2
            );

            c.line.setAttribute(
                "x2",
                b.element.offsetLeft +
                b.element.offsetWidth / 2
            );

            c.line.setAttribute(
                "y2",
                b.element.offsetTop +
                b.element.offsetHeight / 2
            );

        }
    );

}


/* =====================
   FIND PATH BFS
===================== */

function findPath(start,end){

    const graph = {};


    devices.forEach(
        d => graph[d.id] = []
    );


    connections.forEach(
        c => {

            graph[c.a].push(c.b);

            graph[c.b].push(c.a);

        }
    );


    const queue =
        [[start]];

    const visited =
        new Set([start]);


    while(queue.length){

        const path =
            queue.shift();

        const current =
            path[path.length - 1];


        if(current === end){
            return path;
        }


        graph[current].forEach(
            next => {

                if(
                    !visited.has(next)
                ){

                    visited.add(next);

                    queue.push([
                        ...path,
                        next
                    ]);

                }

            }
        );

    }


    return null;

}


/* =====================
   EVENT
===================== */

function addEvent(
    type,
    text
){

    const event =
        document.createElement(
            "div"
        );


    event.className =
        "event " + type;


    let icon = "⚪";

    if(type === "sending"){
        icon = "🟡";
    }

    if(type === "success"){
        icon = "🟢";
    }

    if(type === "failed"){
        icon = "🔴";
    }


    event.innerHTML =
        `<b>${icon} ${type.toUpperCase()}</b><br>${text}`;


    eventLog.prepend(
        event
    );

}


/* =====================
   START SIMULATION
===================== */

function startSimulation(){

    if(
        devices.length < 2
    ){

        alert(
            "Tambahkan minimal 2 perangkat."
        );

        return;

    }


    successCounter = 0;

    failedCounter = 0;

    packetCounter = 0;

    updateUI();


    eventLog.innerHTML = "";


    let delay = 0;


    /*
    KIRIM ANTAR
    PERANGKAT BERBEDA
    */

    for(
        let i = 0;
        i < devices.length;
        i++
    ){

        for(
            let j = 0;
            j < devices.length;
            j++
        ){

            if(i === j){
                continue;
            }


            const from =
                devices[i];

            const to =
                devices[j];


            setTimeout(
                () => {

                    sendPacket(
                        from,
                        to
                    );

                },
                delay
            );


            delay += 350;

        }

    }

}


/* =====================
   SEND PACKET
===================== */

function sendPacket(
    from,
    to
){

    packetCounter++;

    const packetId =
        packetCounter;


    const path =
        findPath(
            from.id,
            to.id
        );


    /*
    FAILED
    */

    if(!path){

        failedCounter++;

        updateUI();


        setDeviceState(
            from,
            "error"
        );


        setDeviceState(
            to,
            "error"
        );


        addEvent(

            "failed",

            `Packet #${packetId}: 
            ${from.name} → ${to.name}
            <br>
            Destination Unreachable`

        );


        setTimeout(
            updateDeviceOnlineStatus,
            1500
        );


        return;

    }


    /*
    SENDING
    */

    addEvent(

        "sending",

        `Packet #${packetId}: 
        ${from.name} → ${to.name}
        <br>
        Sending packet...`

    );


    const packet =
        document.createElement(
            "div"
        );


    packet.className =
        "packet";

    packet.textContent =
        "📦";


    workspace.appendChild(
        packet
    );


    activePackets.push(
        packet
    );


    let index = 0;


    /*
    OFFSET BERBEDA
    UNTUK SETIAP PAKET
    */

    const offsetX =
        ((packetId % 5) - 2) * 5;

    const offsetY =
        ((packetId % 4) - 2) * 5;


    function movePacket(){

        if(index >= path.length){

            packet.remove();


            activePackets =
                activePackets.filter(
                    p => p !== packet
                );


            successCounter++;

            updateUI();


            updateDeviceOnlineStatus();


            addEvent(

                "success",

                `Packet #${packetId}: 
                ${from.name} → ${to.name}
                <br>
                Successfully Delivered`

            );


            return;

        }


        const device =
            devices.find(
                d =>
                d.id === path[index]
            );


        if(!device){

            packet.remove();

            return;

        }


        /*
        STATUS KUNING
        */

        setDeviceState(
            device,
            "transmitting"
        );


        const x =
            device.element.offsetLeft +
            device.element.offsetWidth / 2 -
            13 +
            offsetX;


        const y =
            device.element.offsetTop +
            device.element.offsetHeight / 2 -
            13 +
            offsetY;


        packet.style.left =
            x + "px";

        packet.style.top =
            y + "px";


        setTimeout(
            () => {

                setDeviceState(
                    device,
                    "active"
                );

            },
            500
        );


        index++;


        setTimeout(
            movePacket,
            700
        );

    }


    movePacket();

}


/* =====================
   DELETE
===================== */

function deleteSelected(){

    if(
        selectedForDelete === null
    ){

        alert(
            "Pilih perangkat terlebih dahulu."
        );

        return;

    }


    const id =
        selectedForDelete;


    const device =
        devices.find(
            d => d.id === id
        );


    if(device){

        device.element.remove();

    }


    connections =
        connections.filter(
            c => {

                if(
                    c.a === id ||
                    c.b === id
                ){

                    c.line.remove();

                    return false;

                }

                return true;

            }
        );


    devices =
        devices.filter(
            d => d.id !== id
        );


    selectedForDelete = null;

    clearSelection();

    updateDeviceOnlineStatus();

    updateUI();

}


/* =====================
   CLEAR
===================== */

function clearSelection(){

    devices.forEach(
        d => {

            d.element.classList.remove(
                "selected"
            );

        }
    );

}


/* =====================
   RESET
===================== */

function resetNetwork(){

    document.querySelectorAll(
        ".device,.packet"
    ).forEach(
        e => e.remove()
    );


    networkSvg.innerHTML = "";


    devices = [];

    connections = [];

    selectedDevices = [];

    selectedForDelete = null;

    idCounter = 0;

    pcCounter = 0;

    packetCounter = 0;

    successCounter = 0;

    failedCounter = 0;

    activePackets = [];


    eventLog.innerHTML =
        `<div class="event">
        Sistem berhasil direset.
        </div>`;


    updateUI();

}


/* =====================
   STAR
===================== */

function createStar(){

    resetNetwork();


    setTimeout(
        () => {

            const w =
                workspace.clientWidth;

            const h =
                workspace.clientHeight;


            const center =
                addDevice(
                    "Switch",
                    w/2-44,
                    h/2-39
                );


            const positions = [

                [20,30],

                [w-110,30],

                [20,h-110],

                [w-110,h-110]

            ];


            positions.forEach(
                pos => {

                    const pc =
                        addDevice(
                            "PC",
                            pos[0],
                            pos[1]
                        );


                    createConnection(
                        center.id,
                        pc.id
                    );

                }
            );

        },
        50
    );

}


/* =====================
   BUS
===================== */

function createBus(){

    resetNetwork();


    setTimeout(
        () => {

            let previous =
                null;


            for(
                let i = 0;
                i < 4;
                i++
            ){

                const pc =
                    addDevice(
                        "PC",
                        15 + i * 90,
                        280
                    );


                if(previous){

                    createConnection(
                        previous.id,
                        pc.id
                    );

                }


                previous = pc;

            }

        },
        50
    );

}


/* =====================
   RING
===================== */

function createRing(){

    resetNetwork();


    setTimeout(
        () => {

            const list = [];

            const w =
                workspace.clientWidth;

            const h =
                workspace.clientHeight;


            for(
                let i = 0;
                i < 5;
                i++
            ){

                const angle =
                    (i / 5) *
                    Math.PI * 2 -
                    Math.PI / 2;


                const pc =
                    addDevice(

                        "PC",

                        w/2 +
                        Math.cos(angle)*115 -
                        40,

                        h/2 +
                        Math.sin(angle)*150 -
                        37

                    );


                list.push(
                    pc
                );

            }


            for(
                let i = 0;
                i < list.length;
                i++
            ){

                createConnection(

                    list[i].id,

                    list[
                        (i+1) %
                        list.length
                    ].id

                );

            }

        },
        50
    );

}

   RESIZE
===================== */

window.addEventListener(
    "resize",
    () => {

        updateConnections();

    }
);


updateUI();
